name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches: [ main, dev, stage ]
  pull_request:
    branches: [main, dev, stage]

permissions:
  contents: write

jobs:
  UnitTest:
    runs-on: ubuntu-latest
    env:
      DATABASE_NAME: test_database

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Determine output folder
        id: set_output_folder
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            branch_name="$GITHUB_BASE_REF"
          else
            branch_name="$GITHUB_REF_NAME"
          fi

          case "$branch_name" in
            main)  echo "output_folder=prod"  >> "$GITHUB_ENV" ;;
            stage) echo "output_folder=stage" >> "$GITHUB_ENV" ;;
            dev)   echo "output_folder=dev"   >> "$GITHUB_ENV" ;;
            *) echo "Unknown branch: $branch_name"; exit 1 ;;
          esac

      - name: Run tests with coverage
        shell: bash
        run: |
          set -o pipefail
          timestamp="$(date '+%Y-%m-%d_%H-%M-%S')"
          mkdir -p test_results
          log_file="test_results/${timestamp}_report.log"

          {
            echo
            echo "Test Cases Report"
            echo
          } | tee -a "$log_file"

          python -m coverage run --source=src -m unittest discover -s tests -v 2>&1 | tee -a "$log_file"
          test_status=${PIPESTATUS[0]}

          echo -e "\nCoverage Report\n" | tee -a "$log_file"
          coverage report 2>&1 | tee -a "$log_file"

          exit $test_status

      - name: Check coverage
        run: coverage report --fail-under=85

      - name: Generate coverage badge
        run: |
          pip install coverage-badge
          mkdir -p badge-out
          coverage-badge -f -o badge-out/coverage.svg

      - name: Publish coverage badge to badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cp badge-out/coverage.svg /tmp/coverage.svg
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin badges || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git checkout badges
          else
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi
          cp /tmp/coverage.svg coverage.svg
          git add coverage.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage badge"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:badges
          else
            echo "No badge changes to commit."
          fi

      - name: Upload test log artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-log
          path: test_results/

      - name: Upload report to Azure
        uses: LanceMcCarthy/Action-AzureBlobUpload@v2
        with:
          source_folder: 'test_results'
          destination_folder: '${{ env.output_folder }}'
          connection_string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          container_name: 'tdei-sanitization-service'
          clean_destination_folder: false
          delete_if_exists: false
